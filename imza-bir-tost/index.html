<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../favicon.png">
<meta charset="UTF-8">
<link rel="apple-touch-icon" sizes="300x300" href="../favicon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<title>imza bir tost branding</title>
<style>
.video-container {
  position: relative; padding-bottom: 56.25%;
  height: 0; overflow: hidden;
  max-width: 1025px; margin: auto;
}
.video-container iframe,
.video-container object,
.video-container embed {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
}
.galeri {
  padding-top: 30px; gap: 30px;
  display: flex; max-width: 800px; margin: auto;
}
.galeri img {
  flex: 1 1 calc((100% - 60px) / 3);
  max-width: calc((100% - 60px) / 3);
  height: auto; display: block;
}
#lb {
  display: none; position: fixed; inset: 0;
  background: rgba(255,255,255,0.88);
  z-index: 9999; user-select: none;
  align-items: center; justify-content: center;
}
#lb.open { display: flex; }
#lb img {
  max-width: 90vw; max-height: 90vh;
  object-fit: contain; display: block;
}
.foot { text-align: center; margin-top: 30px; margin-bottom: 30px; }
p { padding-top: 30px; text-align: center; margin-left: auto; margin-right: auto; max-width: 800px; }
a { color: black; text-decoration-style: dashed; }
header { text-align: center; margin-top: 30px; }
img, video { max-width: 100%; height: auto; vertical-align: middle; user-select: none; -webkit-user-select: none; }
h1 { text-align: center; font-family: "Outfit", sans-serif; font-weight: 400; }
.wrapper {
  text-align: center; margin-left: auto; margin-right: auto;
  padding-top: 30px; max-width: 1080px;
  font-family: "Outfit", sans-serif; font-weight: 400;
}
/* One 30px gap between content modules; legacy BR spacing is ignored. */
.wrapper > h1 { margin: 0 0 30px; }
.project-content { display: flex; flex-direction: column; gap: 30px; }
.project-content > br { display: none; }
.project-content > * { flex-shrink: 0; margin: 0 auto; }
.project-content > p { padding: 0; width: 100%; }
.project-content > .galeri { padding-top: 0; width: 100%; }
.project-content > .video-container,
.project-content > .vimeo-run { width: 100%; }
.project-content > img { align-self: center; }

</style>
</head>
<body>
  <header>
    <a href="https://studiomoi.co"><img src="../logo.png" alt="studio moi"></a>
  </header>
  <div id="lb" onclick="this.classList.remove('open')">
    <img id="lb-img" src="" alt="">
  </div>
  <div class="wrapper">
    <h1>imza bir tost branding</h1>
    <div class="project-content">
    <br>
<img src="ibt1.jpg" width="1024" height="573" alt="Proje Resmi">
<br>
<br>
<img src="ibt2.jpg" width="1024" height="573" alt="Proje Resmi">
<br>
<br>
<img src="ibt3.jpg" width="1024" height="573" alt="Proje Resmi">
<br>
<br>
<img src="ibt5.jpg" width="1024" height="573" alt="Proje Resmi">
<br>
<div class="galeri">
    <img src="ibtg1.jpg" width="900" height="900" alt="Proje Galeri Resmi">
    <img src="ibtg2.jpg" width="900" height="900" alt="Proje Galeri Resmi">
    <img src="ibtg3.jpg" width="900" height="900" alt="Proje Galeri Resmi">
</div>
<br>
<br>
<img src="ibtkart.jpg" width="1024" height="792" alt="Proje Resmi">
<br>
<br>
<img src="ibtmenu.jpg" width="1024" height="576" alt="Proje Resmi">
<br>
<br>
<img src="ibtmenudik.jpg" width="1024" height="588" alt="Proje Resmi">
<br>
<div class="galeri">
    <img src="g21.png" width="478" height="478" alt="Proje Galeri Resmi">
    <img src="g22.png" width="475" height="475" alt="Proje Galeri Resmi">

</div>

<a href="https://www.instagram.com/imzabirtost/" target="_blank">imza bir tost on instagram</a>

    </div>
  </div>
  <div class="foot">
    <a href="https://studiomoi.co" style="text-decoration: none;">studio moi</a>
  </div>
  <script>
  var lb = document.getElementById('lb');
  document.querySelectorAll('.galeri img').forEach(function(img) {
    img.addEventListener('click', function() {
      document.getElementById('lb-img').src = this.src;
      lb.classList.add('open');
    });
  });
  window.addEventListener('scroll', function() {
    lb.classList.remove('open');
  }, { passive: true });
  </script>

</body>
</html>
