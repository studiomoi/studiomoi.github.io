<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="../favicon.png">
<meta charset="UTF-8">
<link rel="apple-touch-icon" sizes="300x300" href="../favicon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<title>Animated Packshots for Misli.com</title>
<style>
.video-container {
  position: relative; padding-bottom: 56.25%;
  height: 0; overflow: hidden;
  max-width: 1025px; margin: auto;
}
.video-container iframe,
.video-container object,
.video-container embed {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
}
.galeri {
  padding-top: 30px; gap: 30px;
  display: flex; max-width: 800px; margin: auto;
}
.galeri img {
  flex: 1 1 calc((100% - 60px) / 3);
  max-width: calc((100% - 60px) / 3);
  height: auto; display: block;
}
#lb {
  display: none; position: fixed; inset: 0;
  background: rgba(255,255,255,0.88);
  z-index: 9999; user-select: none;
  align-items: center; justify-content: center;
}
#lb.open { display: flex; }
#lb img {
  max-width: 90vw; max-height: 90vh;
  object-fit: contain; display: block;
}
.foot { text-align: center; margin-top: 30px; margin-bottom: 30px; }
p { padding-top: 30px; text-align: center; margin-left: auto; margin-right: auto; max-width: 800px; }
a { color: black; text-decoration-style: dashed; }
header { text-align: center; margin-top: 30px; }
img, video { max-width: 100%; height: auto; vertical-align: middle; user-select: none; -webkit-user-select: none; }
h1 { text-align: center; font-family: "Outfit", sans-serif; font-weight: 400; }
.wrapper {
  text-align: center; margin-left: auto; margin-right: auto;
  padding-top: 30px; max-width: 1080px;
  font-family: "Outfit", sans-serif; font-weight: 400;
}
/* One 30px gap between content modules; legacy BR spacing is ignored. */
.wrapper > h1 { margin: 0 0 30px; }
.project-content { display: flex; flex-direction: column; gap: 30px; }
.project-content > br { display: none; }
.project-content > * { flex-shrink: 0; margin: 0 auto; }
.project-content > p { padding: 0; width: 100%; }
.project-content > .galeri { padding-top: 0; width: 100%; }
.project-content > .video-container,
.project-content > .vimeo-run { width: 100%; }
.project-content > img { align-self: center; }
.vimeo-run {
  display: flex; flex-wrap: wrap; justify-content: center;
  align-items: flex-start; gap: 30px;
  max-width: 1025px; margin: auto;
}
.vimeo-run > .video-container {
  flex: 0 0 100%; width: 100%; margin: 0;
  padding-bottom: 0; height: auto; aspect-ratio: 16 / 9;
}
.vimeo-run > .video-container.vimeo-portrait {
  flex-basis: calc((100% - 60px) / 3);
  width: calc((100% - 60px) / 3);
}
.vimeo-run > .video-container.vimeo-square {
  flex-basis: calc((100% - 30px) / 2);
  width: calc((100% - 30px) / 2);
}
@media (max-width: 600px) {
  .vimeo-run > .video-container.vimeo-portrait,
  .vimeo-run > .video-container.vimeo-square {
    flex-basis: 100%; width: 100%;
  }
}
</style>
</head>
<body>
  <header>
    <a href="https://studiomoi.co"><img src="../logo.png" alt="studio moi"></a>
  </header>
  <div id="lb" onclick="this.classList.remove('open')">
    <img id="lb-img" src="" alt="">
  </div>
  <div class="wrapper">
    <h1>Animated Packshots for Misli.com</h1>
    <div class="project-content">
    <p>We've made physical simulations and renders for misli.com packshots.</p>
<br>
<div class="vimeo-run">
<div class="video-container">
    <iframe src="https://player.vimeo.com/video/558117461" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
</div>
<div class="video-container">
    <iframe src="https://player.vimeo.com/video/558124027" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
</div>
</div>
    </div>
  </div>
  <div class="foot">
    <a href="https://studiomoi.co" style="text-decoration: none;">studio moi</a>
  </div>
  <script>
  var lb = document.getElementById('lb');
  document.querySelectorAll('.galeri img').forEach(function(img) {
    img.addEventListener('click', function() {
      document.getElementById('lb-img').src = this.src;
      lb.classList.add('open');
    });
  });
  window.addEventListener('scroll', function() {
    lb.classList.remove('open');
  }, { passive: true });
  </script>
<script>
(function () {
  var frames = document.querySelectorAll('.vimeo-run iframe');
  if (!frames.length) return;
  function init() {
    if (!window.Vimeo || !window.Vimeo.Player) return;
    frames.forEach(function (frame) {
      try {
        var player = new window.Vimeo.Player(frame);
        var timer;
        var timeout = new Promise(function (_, reject) {
          timer = setTimeout(function () { reject(new Error('Vimeo timeout')); }, 10000);
        });
        Promise.race([
          Promise.all([player.getVideoWidth(), player.getVideoHeight()]), timeout
        ]).then(function (size) {
          var w = Number(size[0]), h = Number(size[1]);
          if (!Number.isFinite(w) || !Number.isFinite(h) || w <= 0 || h <= 0) return;
          var box = frame.parentElement;
          box.style.aspectRatio = w + ' / ' + h;
          box.classList.toggle('vimeo-portrait', h > w);
          box.classList.toggle('vimeo-square', w === h);
        }).catch(function () {
          // Keep the usable 16:9 embed when metadata is unavailable.
        }).finally(function () { clearTimeout(timer); });
      } catch (_) { /* Keep the original embed on SDK failure. */ }
    });
  }
  if (window.Vimeo && window.Vimeo.Player) { init(); return; }
  var sdk = document.createElement('script');
  sdk.src = 'https://player.vimeo.com/api/player.js';
  sdk.async = true;
  sdk.onload = init;
  document.head.appendChild(sdk);
})();
</script>
</body>
</html>
